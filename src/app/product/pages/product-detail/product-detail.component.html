<div class="product-detail-container" style="margin-top: 10px;">
  <h1 class="page-title">Detalle del Producto</h1>

  <div class="product-content">
    <!-- Imagen del producto -->
    <div class="product-image-container">
      <img class="product-image" [src]="product.image" alt="{{ product.name }}">
    </div>

    <!-- Información del producto -->
    <div class="product-info">
      <h2 class="product-name">{{ product.name }}</h2>
      <p class="product-price">
        <strong>Precio:</strong> {{ cambiarMoneda(product.price) }}
      </p>
      <p class="product-detail">
        <strong>Detalle:</strong> {{ product.details }}
      </p>
      <p class="product-store">
        <strong>Tienda:</strong> {{ product.storeName }}
      </p>
    </div>
  </div>

  <!-- Botones de acción -->
  <div class="action-buttons">
    <button class="btn btn-primary" (click)="addProductShoppingCart(product)">
      Añadir al Carrito
    </button>
    <button class="btn btn-secondary" [routerLink]="['/carrito']">
      Ir al Carrito de Compras
    </button>
    <button class="btn btn-success" [routerLink]="['/product-order', product.id]">
      Realizar Pedido
    </button>
  </div>
</div>
