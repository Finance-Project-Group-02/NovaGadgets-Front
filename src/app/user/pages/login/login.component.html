<div id="carouselContainer" class="login-container">
  <!-- Carrusel de fondo -->
  <div id="backgroundCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active" data-bs-interval="4000">
        <img src="assets/images/background1.png" class="d-block w-100" alt="Imagen 1">
      </div>
      <div class="carousel-item" data-bs-interval="4000">
        <img src="assets/images/background2.png" class="d-block w-100" alt="Imagen 2">
      </div>
    </div>
  </div>

  <!-- Formulario de inicio de sesión -->
  <div class="login-form linea">
    <img src="assets/images/logoNovaGadgets.jpg" class="img-fluid" alt="Logo" class="logo">
    <form (ngSubmit)="onSubmit(loginForm)" #loginForm="ngForm">
      <div class="mb-3">
        <input
          type="text"
          [(ngModel)]="login.email"
          name="email"
          #email="ngModel"
          class="form-control"
          placeholder="Usuario"
          required
        />
        <!-- Mensaje de error para el campo 'email' -->
        <div *ngIf="email.invalid && (email.touched || loginForm.submitted)" class="error-message">
          Usuario es requerido.
        </div>
      </div>
    
      <div class="mb-3">
        <input
          type="password"
          [(ngModel)]="login.password"
          name="password"
          #password="ngModel"
          class="form-control"
          placeholder="Contraseña"
          required
        />
        <!-- Mensaje de error para el campo 'password' -->
        <div *ngIf="password.invalid && (password.touched || loginForm.submitted)" class="error-message">
          Contraseña es requerida.
        </div>
      </div>
    
      <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
    
  </div>
</div>
